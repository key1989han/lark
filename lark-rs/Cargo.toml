[package]
name = "lark-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the Lark parsing toolkit"
license = "MIT"
repository = "https://github.com/okalldal/lark"
homepage = "https://okalldal.github.io/lark/"
readme = "README.md"

# lark-rs is the workspace root and a member. Sibling members are the C-API crate
# (`lark_h`, issue #48) and the compile-time `include_lark!` proc-macro
# (`lark_proc`, issue #49); keeping them here means the CI `cargo test --all` /
# `cargo fmt --all` run from this directory cover all three without any extra step.
#
# `python/` (the PyO3 binding) is deliberately NOT a member: it is a pyo3
# `extension-module` cdylib built by `maturin` in its own CI job, and pulling it
# into `cargo test --all` would force a Python link on every build. It lives inside
# this directory, so it must be excluded explicitly — otherwise cargo refuses to
# operate on it standalone ("believes it's in a workspace when it's not").
# `wasm/` (the wasm-bindgen binding, #47) is excluded for the same reason: it is
# built by `wasm-pack` for wasm32-unknown-unknown in its own CI job, and its
# JS-facing surface adds nothing to a host-target `cargo test --all`.
[workspace]
members = ["lark_h", "lark_proc"]
exclude = ["python", "wasm"]

[features]
# Deterministic work counters for the profile-first perf discipline (#56). Off by
# default so the normal build and the hot parse path carry zero overhead; turn on
# with `--features perf-counters` to read `lark_rs::perf` (the noise-free
# super-linearity regression net, `tests/test_earley_scaling.rs`).
perf-counters = []
# Widen the private source-position storage from u32 to u64 (ADR-0040). Default OFF:
# positions are stored as u32, halving the Token/Meta position payload (the hot-path
# memcpy win) at the cost of a 4 GiB (u32::MAX) input bound. Turn this on ONLY to
# parse >4 GiB inputs — it restores the pre-ADR-0040 layout. Additive-safe: it only
# enlarges private storage; the public accessors return `usize` either way, so
# enabling it anywhere in a dependency graph can never change a public type or break
# a caller. See `lark_rs::tree::PosInt`.
wide-positions = []
# EXPERIMENTAL, default OFF (ADR-0029 fork 3): the zero-copy `SpanTree<'i>` output
# backend (C8, #233) and its `Lark::parse_span` entry point. Gated because the
# borrowed-span surface is *not stabilised* until its projection + counter gates are
# accepted as a public commitment; a default build carries none of it. The gates
# themselves live behind this feature (projection) plus `perf-counters` (the
# `tree_nodes_built == 0` / `token_value_string_bytes == 0` proofs).
span-tree = []
# EXPERIMENTAL, default OFF, internal-only (#243 C8c, needs-decision): the flat-tape
# output backend prototype (`Lark::parse_tape`, src/parsers/tape.rs). Appends the
# whole parse to two flat arrays (O(log n) allocator calls per parse); projection +
# counter gates in tests/test_tape_tree.rs. Not a public commitment.
tape-tree = []
# TEST-ONLY (not a user escape hatch): re-enables the `Regex` reference backend's
# historical `fancy-regex` side-probes so the whole-lexer differential
# (tests/test_scanner_differential.rs) has an independent oracle. Default OFF, and
# grammar-build outcomes are identical either way BY CONSTRUCTION: the feature build
# routes every regex-rejected terminal through the same refusal seam
# (`lexer::route_fancy_only_terminal`, docs/LOOKAROUND_SCOPE.md) before building a
# probe, so it can never widen the accepted grammar set — it only swaps the matcher
# used for terminals that LOWER (pinned by
# `lexer::tests::global_verbose_flag_refuses_lookaround_lowering`, which runs under
# both builds).
fancy-oracle = ["dep:fancy-regex"]
# THROWAWAY SPIKE (parser-optimization spike 2026-07-03, docs/notes/): exposes the
# DfaScanner's plain dense DFA + retype seam so `examples/baked_dfa_lex.rs` /
# `examples/bake_dfa_gen.rs` can extract and drive a baked (flat-table / generated
# goto-switch) copy of the same automaton. Not a public commitment; never enabled
# by default; delete with the spike.
baked-dfa-spike = []

[dependencies]
regex = "1.10"
# `fancy-regex` is **NOT a runtime dependency** (L4, `docs/LEXER_DFA_PLAN.md`): every
# terminal either compiles on the linear `regex` crate, lowers into the
# `regex-automata` DFA, or fails the grammar build with the categorized scope error
# (`docs/LOOKAROUND_SCOPE.md`). It remains in two test-only roles: a [dev-dependencies]
# per-pattern oracle (equivalence/proof tests), and — behind the default-OFF
# `fancy-oracle` feature below — the historical fancy side-probes of the `Regex`
# reference backend, so the whole-lexer differential keeps an independent reference.
# It is not a user escape hatch; default builds contain zero fancy-regex code
# (`cargo tree -e normal` shows no fancy-regex), and grammar-build outcomes are
# identical with and without the feature.
fancy-regex = { version = "0.18", optional = true }
# Dense-DFA support for the strict-mode regex-collision check (issue #35): the
# `regex` crate has no intersection/emptiness test, so we drop to its automata
# layer and run a product construction over two terminals' DFAs.
regex-automata = "0.4"
# `regex-syntax` (already in the tree via `regex`) gives us the parsed HIR used to
# compute a terminal's finite max-width for Python-parity terminal ordering (#268):
# Python's `sre_parse.getwidth()[1]`. We walk the HIR in *characters* (not the HIR's
# byte length) so a multibyte literal counts as Python counts it.
regex-syntax = "0.8"
indexmap = "2"
thiserror = "1"
smallvec = "1"
# Unicode XID_Continue for the reconstructor's identifier-fusion separator
# heuristic (Python Lark's `is_id_continue`): combining marks and connector
# punctuation must count, or adjacent tokens fuse on re-parse. Already in the
# build graph transitively; tiny, zero-dep, no_std.
unicode-ident = "1"

[dev-dependencies]
pretty_assertions = "1"
serde_json = "1"
# The owned-tree layout spike (`examples/owned_tree_layout_alloc.rs`) measures a
# SmallVec-inline child-list variant as one of its data points.
smallvec = "1"
# The standalone-parser round-trip test (`tests/test_standalone.rs`) `include!`s a
# generated parser, which depends only on `regex` — so the test crate needs it too.
regex = "1.10"
# The lookaround-elimination match-length equivalence proof (`tests/test_lookaround.rs`)
# runs each *original* lookaround terminal on `fancy-regex` and its lookaround-free
# *rewrite* on `regex`, then asserts the two anchored matched-prefix functions agree
# over a generated corpus. The test crate therefore needs the backtracking engine too.
fancy-regex = "0.18"
# The L2 Route-1 DFA-equivalence proof (`tests/test_lowering_proof.rs`) reads the
# lowered terminal's byte-equivalence classes and state count off a dense DFA to
# derive a complete (Myhill-Nerode-bounded) enumeration alphabet and length bound.
regex-automata = "0.4"

[[example]]
name = "json_parser"
path = "examples/json_parser.rs"

# THROWAWAY SPIKE examples (parser-optimization spike 2026-07-03). They need the
# spike-only accessors behind `baked-dfa-spike`; without the feature cargo skips
# the targets. `bake_dfa_gen` regenerates `examples/baked/json_dfa.rs`.
[[example]]
name = "baked_dfa_lex"
path = "examples/baked_dfa_lex.rs"
required-features = ["baked-dfa-spike"]

[[example]]
name = "bake_dfa_gen"
path = "examples/bake_dfa_gen.rs"
required-features = ["baked-dfa-spike"]

# THROWAWAY SPIKE (L5 standalone-bake spike 2026-07-03, docs/notes/). Reuses the
# baked-dfa-spike accessors; delete with the spike.
[[example]]
name = "standalone_bake_probe"
path = "examples/standalone_bake_probe.rs"
required-features = ["baked-dfa-spike"]

[[example]]
name = "standalone_bake_lex"
path = "examples/standalone_bake_lex.rs"
required-features = ["baked-dfa-spike"]

[[example]]
name = "standalone_bake_emit"
path = "examples/standalone_bake_emit.rs"
required-features = ["baked-dfa-spike"]

# In-process oracle digest for the Part-B correctness gate (no spike feature needed).
[[example]]
name = "standalone_oracle_digest"
path = "examples/standalone_oracle_digest.rs"

# The L0 whole-lexer differential needs the fancy-oracle reference backend (the
# `Regex` backend's historical fancy side-probes) — meaningless against the lowered
# probes, which share the machinery under test. CI and check.sh run it BY NAME
# (`cargo test -p lark-rs --features fancy-oracle --lib --test
# test_scanner_differential`; plain `cargo test` skips it) on the assumption that
# this is the only fancy-oracle-gated [[test]]. If you add another [[test]] with
# required-features = ["fancy-oracle"], you MUST add its --test flag to
# .github/workflows/lark-rs.yml and lark-rs/scripts/check.sh, or it will never
# run anywhere — cargo gives no error for a required-features target that is
# simply not selected.
[[test]]
name = "test_scanner_differential"
required-features = ["fancy-oracle"]

# Recorded-trend perf baseline (LALR), not a CI gate. `harness = false` runs the
# file's own `main()` directly, so no benchmarking crate is needed. Invoke with
# `cargo bench --bench parse`; see benches/parse.rs.
[[bench]]
name = "parse"
path = "benches/parse.rs"
harness = false

# Cross-engine comparison (lark-rs vs Python Lark) over JSON / Python / SQL
# workloads (#50). Shells out to benches/vs_python_lark.py for the Python side and
# prints the per-workload speedup. Recorded trend, not a CI gate — see BENCH.md.
[[bench]]
name = "vs_python_lark"
path = "benches/vs_python_lark.rs"
harness = false

# Lexing throughput: the regex-crate Scanner vs the regex-automata DfaScanner
# (docs/LEXER_DFA_PLAN.md, phase L1). Times the lexer in isolation under each
# backend over JSON / expr / Python workloads and prints the dfa/regex ratio.
# Recorded trend, not a CI gate — see BENCH.md. Requires the fancy-oracle feature
# so the Regex backend it measures is the historical fancy-probe reference.
[[bench]]
name = "lex_backends"
path = "benches/lex_backends.rs"
harness = false
required-features = ["fancy-oracle"]

# Scan-cost characterization of the (now fully LOWERED) bundled lookaround
# terminals — historically the two-tier fancy-regex ReDoS artifact (#40); today it
# pins that the lowered DFA path stays linear. Recorded trend, not a CI gate.
[[bench]]
name = "redos"
path = "benches/redos.rs"
harness = false

[profile.release]
opt-level = 3
lto = true

# Wild-grammar bank trend (build + parse over tests/wild). Same recorded-trend
# discipline as benches/parse.rs; see benches/wild.rs.
[[bench]]
name = "wild"
path = "benches/wild.rs"
harness = false
