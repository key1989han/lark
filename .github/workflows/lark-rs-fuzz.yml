name: lark-rs differential fuzz (nightly)

# Out-of-band tiers of the differential fuzzer — never on the PR critical path.
#
# `discover` is the *discovery* tier: it generates a large batch of inputs with
# fresh entropy, freezes Python Lark's verdict for each (into a throwaway scratch
# corpus, not the committed one), and replays lark-rs against it. A RED here is a
# new find: the batch is uploaded as an artifact so it can be minimized
# (`--minimize`) and kept (`--record`) as a permanent regression case. Nothing is
# ever committed by this job.
#
# `seed-range-regression` is the *regression* tier (epic #208): it replays the
# committed grammar-fuzz seed range (`scripts/fuzz-seed-range.sh`), which was
# once verified clean. Unlike the discovery tiers, it GATES — a RED means a
# once-clean seed diverged again, i.e. a regression, per the "never regress a
# green corpus" invariant.

on:
  schedule:
    - cron: '0 5 * * *'   # daily, 05:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: inputs to generate per run
        default: '5000'
      seed:
        description: RNG seed (blank = derive from the run id, logged for replay)
        default: ''

defaults:
  run:
    working-directory: lark-rs

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Differential fuzz (generate batch, freeze oracle, replay lark-rs)
        run: |
          SEED="${{ github.event.inputs.seed }}"
          [ -z "$SEED" ] && SEED=$(( ${{ github.run_id }} % 2147483647 ))
          COUNT="${{ github.event.inputs.count }}"
          [ -z "$COUNT" ] && COUNT=5000
          echo "::notice::differential fuzz seed=$SEED count=$COUNT (re-run with this seed to reproduce)"

          # Generate into a scratch batch (NOT the committed corpus), freeze the
          # oracle from it, and replay. RED == lark-rs diverged from Python Lark.
          python3 tools/fuzz_differential.py --grammar all -n "$COUNT" \
            --seed "$SEED" --mutate --out "$RUNNER_TEMP/fuzz_batch.json"
          LARK_FUZZ_INPUTS="$RUNNER_TEMP/fuzz_batch.json" \
            python3 tools/generate_oracles.py
          cargo test --test test_fuzz_corpus

      # Random GRAMMAR fuzzing (issue #38) — the grammar-level discovery tier. It
      # generates random small grammars, keeps only those Python Lark builds, and
      # diffs lark-rs against the oracle online via the `differ` binary, routing
      # finds through minimize. A find is written to a JSON artifact for triage
      # (minimize → record). It runs alongside the input-mutation fuzz above but
      # does NOT gate the job: known grammar-class gaps would otherwise turn the
      # nightly permanently red and mask an input-fuzz regression — the find
      # artifact (and the step summary) is the discovery signal, mirroring the
      # discovery-tier philosophy.
      - name: Random grammar fuzz (generate grammars, skip Python rejects, diff lark-rs)
        run: |
          SEED="${{ github.event.inputs.seed }}"
          [ -z "$SEED" ] && SEED=$(( (${{ github.run_id }} + 1) % 2147483647 ))
          # Fewer grammars than inputs: each grammar is a Python-Lark build + a
          # cargo-driven differ build per input, so this is heavier per unit.
          GG_COUNT=400
          echo "::notice::grammar fuzz seed=$SEED count=$GG_COUNT (re-run: --fuzz-grammars --seed $SEED)"

          set +e
          python3 tools/fuzz_differential.py --fuzz-grammars --seed "$SEED" \
            -n "$GG_COUNT" --gg-finds-out "$RUNNER_TEMP/grammar_finds.json" \
            | tee "$RUNNER_TEMP/grammar_fuzz.log"
          status=${PIPESTATUS[0]}
          set -e
          # Surface a find as a workflow notice; the artifact carries the repros.
          if [ "$status" -eq 1 ]; then
            echo "::warning::random grammar fuzz found divergence(s) — see the grammar-fuzz-find artifact (minimize → record)"
          elif [ "$status" -ne 0 ]; then
            echo "::error::random grammar fuzz failed to run (exit $status)"
            exit "$status"
          fi

      - name: Upload batch on a find
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-find-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fuzz_batch.json
            lark-rs/tests/fixtures/oracles/fuzz/corpus.json

      # Always attempt the upload (hashFiles can't see runner.temp — it only
      # resolves paths under GITHUB_WORKSPACE — so we cannot gate on the file's
      # existence here). `if-no-files-found: ignore` makes a clean run (no
      # grammar_finds.json written) a no-op rather than a warning/failure.
      - name: Upload grammar-fuzz finds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-fuzz-find-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/grammar_finds.json
            ${{ runner.temp }}/grammar_fuzz.log

  # The committed-range regression tier (epic #208, ADR-0041). Deterministic —
  # no fresh entropy — and GATING: this range ran clean when it was committed,
  # so any divergence is a regression. A find's JSON carries its full replay
  # recipe (seed + count/gg_rules/gg_inputs); replay a single seed with
  # `LARK_FUZZ_SEED_RANGE=<seed>:<seed> scripts/fuzz-seed-range.sh`.
  # Skipped on a workflow_dispatch that pins a seed — that dispatch is a
  # discovery-find replay, and re-sweeping the whole committed range there is
  # noise for it.
  seed-range-regression:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.seed == ''
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lark-rs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Build the differ ourselves, in release: find_differ_binary prefers
      # target/release/differ when it exists, and its own fallback is an
      # unoptimized debug build — a needless slowdown across a ~57k-input sweep.
      - name: Build the differ (release)
        run: cargo build --release --bin differ

      - name: Replay the committed grammar-fuzz seed range
        run: |
          # Actions' default run shell has -e but NOT pipefail — without this,
          # `| tee` would swallow the sweep's exit 1 and green a real find.
          set -o pipefail
          scripts/fuzz-seed-range.sh \
            --gg-finds-out "$RUNNER_TEMP/seed_range_finds.json" \
            | tee "$RUNNER_TEMP/seed_range.log"

      # The log rides along so a red run that dies before the finds JSON is
      # written (timeout, crash mid-sweep) still leaves the per-seed trail —
      # including any `differ error` lines, which mark infra failures rather
      # than true tree divergences.
      - name: Upload seed-range regression finds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seed-range-regression-find-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/seed_range_finds.json
            ${{ runner.temp }}/seed_range.log
